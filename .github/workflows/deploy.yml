name: Deploy to Server

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all projects
        run: pnpm build

      - name: Package build artifacts
        run: |
          tar -czf dist.tar.gz -C apps/server/dist .
          tar -czf public.tar.gz -C apps/front/dist .
          cp apps/server/package.json .
          cp apps/server/.env.example .

      - name: Deploy multiple files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'dist.tar.gz,public.tar.gz,package.json,.env.example'
          target: /home/www/shuttleClaw/
          strip_components: 0

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/www/shuttleClaw/
            mkdir -p dist && tar -xzf dist.tar.gz -C dist
            mkdir -p public && tar -xzf public.tar.gz -C public
            rm -rf dist.tar.gz public.tar.gz
            docker cp . ${{ secrets.DOCKER_CONTAINER_ID }}:/app/.
            docker restart ${{ secrets.DOCKER_CONTAINER_ID }}
